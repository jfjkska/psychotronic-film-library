# Builds the site with the Jekyll pinned in Gemfile.lock and publishes it to
# GitHub Pages on every push
# to main. The first run also switches Pages on for the repo, so there is
# nothing to click in Settings.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Pages (enables it on first run)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # No --baseurl flag here on purpose. A command-line flag overrides
      # _config.yml, and configure-pages reports the repo path
      # (/psychotronic-film-library) even when the site is served from its own
      # domain at the root. _config.yml holds the right answer: baseurl "".
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
