# Fetches better posters from The Movie Database and commits them.
# Runs when a review is added or changed, and on demand from the Actions tab.
# Needs the repository secret TMDB_API_KEY (Settings → Secrets → Actions).
name: Fetch posters, stills and cards

on:
  push:
    branches: [main]
    paths: ["_posts/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Replace every poster, even ones already large"
        type: boolean
        default: false
      only:
        description: "Only these review slugs, space separated (blank = all)"
        type: string
        default: ""
      candidates:
        description: "Instead of fetching, write a numbered sheet of poster options for the named slugs"
        type: boolean
        default: false
      restills:
        description: "Rebuild the gallery images (and the poster rows) even where a review already has them"
        type: boolean
        default: false
      revariants:
        description: "Rebuild only the rows of other posters"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: posters
  cancel-in-progress: true

jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      # An ordinary push only touched the reviews in its own diff; scope the
      # fetch to those slugs so adding one review doesn't re-check all of
      # them against TMDB (that full scan is 30-65 minutes). A dispatch run
      # keeps using whatever `only` was typed in (blank = everything), and if
      # the diff can't be computed for any reason this falls back to the old
      # full-library behaviour rather than fetching nothing.
      - name: Determine touched slugs
        id: touched
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "only=${{ inputs.only }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "only=" >> "$GITHUB_OUTPUT"
          else
            slugs=$(git diff --name-only "$before" "${{ github.sha }}" -- '_posts/*.md' \
              | sed -E 's#^_posts/[0-9]{4}-[0-9]{2}-[0-9]{2}-(.+)\.md$#\1#' \
              | sort -u | tr '\n' ' ')
            echo "only=$slugs" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch posters
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::warning::TMDB_API_KEY secret is not set; nothing fetched. Add it under Settings → Secrets and variables → Actions."
            exit 0
          fi
          python tools/fetch_posters.py ${{ inputs.force && '--force' || '' }} ${{ inputs.candidates && '--candidates' || '' }} ${{ inputs.restills && '--restills' || '' }} ${{ inputs.revariants && '--revariants' || '' }} ${{ steps.touched.outputs.only }}
      - name: Draw share cards
        run: python tools/make_cards.py
      - name: Commit any new posters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/img/posters assets/img/stills assets/img/cards _posts _poster_candidates
          if git diff --cached --quiet; then echo "No poster changes."; exit 0; fi
          git commit -m "Fetch posters from TMDB"
          # A push to main while this was running leaves our commit behind the
          # remote; rebase onto it and try again rather than losing the posters.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::could not push the fetched posters"; exit 1; fi
            git pull --rebase origin main
          done
          # A push made with the workflow token does not start other workflows,
          # so publish the site explicitly.
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
