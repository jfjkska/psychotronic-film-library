# Fetches better posters from The Movie Database and commits them.
# Runs when a review is added or changed, and on demand from the Actions tab.
# Needs the repository secret TMDB_API_KEY (Settings → Secrets → Actions).
name: Fetch posters, stills and cards

on:
  push:
    branches: [main]
    paths: ["_posts/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Replace every poster, even ones already large"
        type: boolean
        default: false
      only:
        description: "Only these review slugs, space separated (blank = all)"
        type: string
        default: ""
      candidates:
        description: "Instead of fetching, write a numbered sheet of poster options for the named slugs"
        type: boolean
        default: false
      restills:
        description: "Rebuild the gallery images (and the poster rows) even where a review already has them"
        type: boolean
        default: false
      revariants:
        description: "Rebuild only the rows of other posters"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: posters
  cancel-in-progress: true

jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      # An ordinary push only touched the reviews in its own diff; scope the
      # fetch to those slugs so adding one review doesn't re-check all of
      # them against TMDB (that full scan is 30-65 minutes). A dispatch run
      # keeps using whatever `only` was typed in (blank = everything), and if
      # the diff can't be computed for any reason this falls back to the old
      # full-library behaviour rather than fetching nothing.
      - name: Determine touched slugs
        id: touched
        # Everything that comes from outside (the typed-in `only`, file names in
        # the push) reaches the shell through env, never pasted into the script,
        # and only plain slugs (letters, digits, . _ -) are passed on.
        env:
          EVENT: ${{ github.event_name }}
          ONLY: ${{ inputs.only }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          slugs_only() { tr ' \t' '\n\n' | { grep -E '^[A-Za-z0-9._][A-Za-z0-9._-]*$' || true; } | sort -u | tr '\n' ' '; }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            only=$(printf '%s' "$ONLY" | slugs_only)
            if [ -n "${ONLY// /}" ] && [ -z "${only// /}" ]; then
              echo "::error::'only' must be review slugs (letters, digits, dots, underscores, hyphens), space separated"
              exit 1
            fi
            echo "only=$only" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "only=" >> "$GITHUB_OUTPUT"
          else
            only=$(git diff --name-only "$BEFORE" "$AFTER" -- '_posts/*.md' \
              | sed -nE 's#^_posts/[0-9]{4}-[0-9]{2}-[0-9]{2}-(.+)\.md$#\1#p' \
              | slugs_only)
            # A push whose review files have no usable slug fetches nothing
            # (an empty list would mean "every review").
            [ -n "${only// /}" ] || only="_none_"
            echo "only=$only" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch posters
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ONLY: ${{ steps.touched.outputs.only }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::warning::TMDB_API_KEY secret is not set; nothing fetched. Add it under Settings → Secrets and variables → Actions."
            exit 0
          fi
          # $ONLY is a checked, space-separated slug list; splitting it into arguments is intended.
          python tools/fetch_posters.py ${{ inputs.force && '--force' || '' }} ${{ inputs.candidates && '--candidates' || '' }} ${{ inputs.restills && '--restills' || '' }} ${{ inputs.revariants && '--revariants' || '' }} $ONLY
      - name: Draw share cards
        run: python tools/make_cards.py
      # Small WebP copies for cards and listings (see tools/make_thumbs.py).
      - name: Make thumbnails
        run: python tools/make_thumbs.py
      - name: Commit any new posters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/img/posters assets/img/stills assets/img/cards assets/img/thumbs _posts _poster_candidates
          if git diff --cached --quiet; then echo "No poster changes."; exit 0; fi
          git commit -m "Fetch posters from TMDB"
          # A push to main while this was running leaves our commit behind the
          # remote; rebase onto it and try again rather than losing the posters.
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::could not push the fetched posters"; exit 1; fi
            git pull --rebase origin main
          done
          # A push made with the workflow token does not start other workflows,
          # so publish the site explicitly.
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
