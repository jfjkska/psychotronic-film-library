name: Check site

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: npm install --prefix "$RUNNER_TEMP/library-tests" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Check library interactions
        run: node tools/test_library.cjs _site "$RUNNER_TEMP/library-tests/node_modules/jsdom"
