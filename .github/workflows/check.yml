name: Check site

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install test dependency
        run: npm install --prefix "$RUNNER_TEMP/library-tests" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Check library interactions
        run: node tools/test_library.cjs _site "$RUNNER_TEMP/library-tests/node_modules/jsdom"
      - name: Check review search metadata
        run: node tools/test_review_seo.cjs _site "$RUNNER_TEMP/library-tests/node_modules/jsdom"
