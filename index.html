---
layout: default
body_class: home
---
<section class="lobby">
  <div class="lobby-head">
    <h1 class="display">Latest reviews</h1>
  </div>

  <form class="finder" role="search" data-finder>
    <label class="sr-only" for="finder-q">Search the library</label>
    <input id="finder-q" type="search" name="q" placeholder="Search films, directors, actors…" autocomplete="off" data-finder-input aria-controls="film-rack">
    <div class="finder-panel" id="finder-panel">
    <div class="finder-controls" data-finder-controls hidden>
      <label>Genre<select name="genre" data-genre-select><option value="">All genres</option>
      {%- assign all_genres = "" | split: "" -%}
      {%- for post in site.posts -%}{%- for g in post.genres -%}{%- assign all_genres = all_genres | push: g -%}{%- endfor -%}{%- endfor -%}
      {%- assign uniq_genres = all_genres | uniq | sort_natural -%}
      {% for g in uniq_genres %}<option value="{{ g | downcase | escape }}">{{ g }}</option>{% endfor %}
      </select></label>
      <label>Decade<select name="decade" data-decade><option value="">All decades</option></select></label>
      <label>Country<select name="country" data-country><option value="">All countries</option></select></label>
      <label>Rating<select name="rating" data-rating><option value="">Any rating</option><option value="3">3–5 eyes</option><option value="4">4–5 eyes</option><option value="5">5 eyes</option></select></label>
      <label>Sort by<select name="sort" data-sort><option value="newest">Newest reviews</option><option value="rating">Highest rated</option><option value="title">Title A–Z</option><option value="year-asc">Oldest films</option><option value="year-desc">Newest films</option></select></label>
    </div>
    </div>
    <div class="finder-summary" data-finder-summary hidden>
      <button type="button" class="chip finder-toggle" data-filter-toggle aria-expanded="false" aria-controls="finder-panel" hidden>Filter &amp; sort<span data-filter-count hidden></span></button>
      <a class="chip" href="{{ site.posts.first.url | relative_url }}" data-dice>Random review</a>
      <p class="sr-only" role="status" aria-live="polite" aria-atomic="true" data-result-count></p>
      <button type="button" class="chip" data-reset-finder hidden>Clear filters</button>
    </div>
  </form>

  <ul class="rack" id="film-rack" data-rack>
    {% for post in site.posts %}{% include card.html post=post %}{% endfor %}
  </ul>
  <p class="empty" data-empty hidden>Nothing on the shelf matches that. Try another word.</p>
</section>
