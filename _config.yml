# ── Psychotronic Film Library ────────────────────────────────────────────────
# Built for GitHub Pages: push to the repo, turn Pages on, done. No build step.

title: Psychotronic Film Library
tagline: Obscure exploitation, giallo, sleaze and the strange stuff in between.
description: >-
  Reviews of obscure exploitation, giallo, eurosleaze, horror and the weird
  psychotronic corners of cinema.
author: Darren Evanson
lang: en-GB

# `url` is the public address, `baseurl` is the path under it.
#   Repo named  <you>.github.io            →  baseurl: ""
#   Repo named  psychotronic-film-library  →  baseurl: "/psychotronic-film-library"
#   Own domain later                       →  url: "https://yourdomain.com", baseurl: ""
url: "https://psychotronicfilmlibrary.com"
baseurl: ""

# Public token from Cloudflare → Web Analytics → this site's JavaScript snippet.
# Leave empty to disable. Local previews never send visit data.
cloudflare_web_analytics_token: "fd1a62c8493a4d8db41054505a63ab7b"

# Contact form. Sign up free at https://formspree.io, make a form, paste its
# endpoint here (looks like https://formspree.io/f/abcdwxyz). Until then the
# form shows a note saying it isn't wired up.
contact_form_endpoint: https://formspree.io/f/xzezzyez

# Email subscriptions use the same RSS feed as reader apps.
followit_url: "https://follow.it/psychotronic-film-library?leanpub"
followit_form_action: "https://api.follow.it/subscription-form/N1J0RUYvWTVNUUtKbnFGQVFYb21xdHFydVFzbDF5U3hydEtkYmFHSXZOV0x6TG9TdEZrRkZGVVlNYXdRMTVhYlJ2VU00d3h6NXViUTFuSkVxb09IRUd0K3hYSE5JYTJZQktWTUF0TSszOXRWTGRNYVlnZG03Mm9WMW83R3JvRnd8QTFNYkVrdGdZdUJTM3BUdTRwVWtXdW14M29TdXEyZU5XTjZmOXVlbkpaTT0=/8"

# Comments on review pages, via giscus (stored in GitHub Discussions on the
# site's repo, free). Leave `repo` empty and no comments box appears.
# Setup: README → "Turning on comments".
giscus:
  repo: ""              # was jfjkska/psychotronic-film-library; switched off, readers would need GitHub accounts
  repo_id: ""           # R_kgDOUgekHA
  category: "General"
  category_id: ""       # DIC_kwDOUgekHM4DF5vQ

# Social card used when a link is shared (Twitter/X, Facebook, WhatsApp).
logo: /assets/img/social-card.jpg

permalink: /reviews/:title/
timezone: Europe/London

# Jekyll hides a post whose `date` is after the clock at build time, with no
# warning. Reviews get dated as they're written, which has landed ahead of
# the real clock before -- that's a post silently missing from the site with
# everything else (posters, cards, publish) reporting success. Off.
future: true

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml
  excerpt_only: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: review
      rating: 0
      author: Darren Evanson

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - HOW-TO-POST.md
  - vendor
  - node_modules
  - tools
