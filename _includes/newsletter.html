{% assign newsletter_user = site.buttondown_username | default: '' | strip %}
{% if newsletter_user != "" %}
<section class="newsletter" aria-label="Newsletter">
  <form action="https://buttondown.com/api/emails/embed-subscribe/{{ newsletter_user | escape }}" method="post" class="newsletter-form">
    <label for="bd-email" class="newsletter-label">New reviews by email</label>
    <div class="newsletter-row">
      <input id="bd-email" type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      <button class="button" type="submit">Subscribe</button>
    </div>
    <input type="hidden" name="embed" value="1">
    <p class="newsletter-small">New reviews from the library. Unsubscribe any time. Your email is sent to Buttondown to manage your subscription.</p>
  </form>
</section>
{% endif %}
