<header class="masthead">
  <a class="banner" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — home">
    <img src="{{ '/assets/img/banner.jpg' | relative_url }}" alt="{{ site.title }}" width="2172" height="724" fetchpriority="high">
  </a>
  <nav class="marquee" aria-label="Main">
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Reviews</a>
    <a href="{{ '/shelf/' | relative_url }}" {% if page.url == '/shelf/' %}aria-current="page"{% endif %}>Browse</a>
    <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    <button type="button" class="nav-toggle" data-menu-toggle aria-expanded="false" aria-controls="marquee-more" hidden>Menu</button>
    <div class="marquee-more" id="marquee-more">
    <a href="{{ '/top-shelf/' | relative_url }}" {% if page.url == '/top-shelf/' %}aria-current="page"{% endif %}>Darren’s picks</a>
    <a href="{{ '/directors/' | relative_url }}" {% if page.url == '/directors/' %}aria-current="page"{% endif %}>Directors</a>
    <a href="{{ '/contact/' | relative_url }}" {% if page.url == '/contact/' %}aria-current="page"{% endif %}>Contact</a>
    <a href="{{ '/updates/' | relative_url }}" {% if page.url == '/updates/' %}aria-current="page"{% endif %}>Email updates</a>
    </div>
  </nav>
  <script type="application/json" data-reel>[{% for post in site.posts %}"{{ post.url | relative_url }}"{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
</header>
