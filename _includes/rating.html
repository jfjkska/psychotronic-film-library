{%- assign r = include.rating | default: 0 | plus: 0 -%}
<span class="eyes" role="img" aria-label="{{ r }} out of 5">
{%- for i in (1..5) -%}
  <svg class="eye{% if i <= r %} lit{% endif %}" viewBox="0 0 32 20" aria-hidden="true"><path class="lid" d="M1 10C6 2 26 2 31 10 26 18 6 18 1 10Z"/><circle class="iris" cx="16" cy="10" r="5.5"/><circle class="pupil" cx="16" cy="10" r="2.4"/></svg>
{%- endfor -%}
</span>
